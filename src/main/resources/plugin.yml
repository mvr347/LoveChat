name: Lovechat
version: "3.0"
main: me.lovelace.lovechat.Lovechat
api-version: '1.21.11'
softdepend: [PlaceholderAPI, CMI, ProtocolLib]
libraries:
  - "com.github.ben-manes.caffeine:caffeine:3.1.8"
commands:
  lovechat:
    description: Основная команда плагина
    aliases: [chat, lc, чат]
    permission: lovechat.use
  lovechatadmin:
    description: Административные команды Lovechat (reload и т.д.)
    permission: lovechat.admin
  channel:
    description: Переключить канал чата
    aliases: [ch, c]
  ignorechat:
    description: Игнорировать игрока
    aliases: [ignore]
  messagedelete:
    description: Удалить сообщение
    aliases: [md]
  messageedit:
    description: Редактировать сообщение
    aliases: [medit]
  silent:
    description: Включить/выключить тихий режим
  chatclear:
    description: Очистка чата
    aliases: [cc]
  tagtoggle:
    description: Включить/выключить упоминания себя
  spy:
    description: Режим шпиона
permissions:
  lovechat.admin:
    default: op
  lovechat.use:
    description: "Доступ к основной команде /lovechat"
    default: true
  lovechat.delete:
    description: "Разрешает удалять свои сообщения"
    default: true
  lovechat.delete.admin:
    description: "Разрешает удалять чужие сообщения"
    default: op
  lovechat.edit:
    description: "Разрешает редактировать свои сообщения"
    default: true
  lovechat.edit.admin:
    description: "Разрешает редактировать чужие сообщения"
    default: op
  lovechat.moderation:
    description: "Доступ к модераторским функциям чата наравне с lovechat.admin"
    default: op
  lovechat.staff.receive:
    description: "Получать уведомления модерации (переопределяется staff-notifications.permission-receive)"
    default: op
  lovechat.cooldown.bypass:
    description: "Обход задержки между сообщениями"
    default: op
  lovechat.json:
    description: "Разрешает JSON-сообщения в чате (переопределяется chat.permission)"
    default: op
  lovechat.mention:
    default: true
  lovechat.mention.everyone:
    default: op
  lovechat.mention.everyone.bypass:
    default: op
  lovechat.links:
    default: true
  lovechat.color:
    default: true
  lovechat.silent:
    default: true
  lovechat.tagtoggle:
    default: op
  lovechat.spy:
    default: op
  lovechat.clear.global:
    default: op
  lovechat.clear.console:
    default: op
