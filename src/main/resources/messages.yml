# ========================================== #
#       Lovechat Messages Configuration  #
#          Version 3.0                       #
# ========================================== #
# Все текстовые сообщения плагина
# Поддерживает MiniMessage форматирование
# ========================================== #

# Префикс плагина (используется во всех сообщениях)
prefix: "<dark_gray>[<aqua>Lovechat</aqua>]</dark_gray> "

# ========================================== #
#           ОБЩИЕ СООБЩЕНИЯ                  #
# ========================================== #
no-permission: "<red>У вас нет прав для выполнения этой команды!</red>"
reload-success: "<green>Конфигурация успешно перезагружена!</green>"
reload-messages-success: "<green>Сообщения успешно перезагружены!</green>"
player-not-found: "<red>Игрок не найден!</red>"
player-only: "<red>Эта команда только для игроков!</red>"
world-disabled: "<red>Lovechat отключен в этом мире.</red>"

# ========================================== #
#         КАНАЛЫ ЧАТА                        #
# ========================================== #
channel-switched: "<green>Вы переключились на канал <aqua>{channel}</aqua>!</green>"
channel-not-found: "<red>Канал не найден!</red>"
no-permission-channel: "<red>У вас нет прав для использования этого канала!</red>"

# ========================================== #
#      УПРАВЛЕНИЕ СООБЩЕНИЯМИ                #
# ========================================== #
# Удаление сообщений
delete-success: "<green>Сообщение #{id} удалено!</green>"
delete-not-found: "<red>Сообщение не найдено!</red>"
delete-not-yours: "<red>Вы можете удалять только свои сообщения!</red>"

# Редактирование сообщений
edit-success: "<green>Сообщение #{id} отредактировано!</green>"
edit-cancelled: "<red>Редактирование отменено!</red>"
edit-not-found: "<red>Сообщение не найдено!</red>"
edit-not-yours: "<red>Вы можете редактировать только свои сообщения!</red>"
edit-prompt: "<yellow>Редактирование сообщения. Введите новое сообщение или измените старое.</yellow><newline><gray>Напишите </gray><red><click:run_command:'/medit cancel'><hover:show_text:'Нажмите для отмены'>cancel</hover></click></red><gray> для отмены.</gray>"
edit-cancelled-command: "<yellow>Редактирование сброшено (введена команда).</yellow>"
edit-cancelled-click: "<red>Редактирование отменено.</red>"

# ========================================== #
#         ИГНОР ЛИСТ                          #
# ========================================== #
ignore-usage: "<yellow>Использование: /ignore <игрок></yellow>"
ignore-not-found: "<red>Игрок не найден!</red>"
ignore-self: "<red>Нельзя игнорировать самого себя!</red>"
ignore-admin: "<red>Нельзя игнорировать администратора!</red>"
ignore-added: "<green>Вы добавили <aqua>{player}</aqua> в игнор-лист.</green>"
ignore-removed: "<green>Вы удалили <aqua>{player}</aqua> из игнор-листа.</green>"

# ========================================== #
#      УПОМИНАНИЯ (MENTIONS)                 #
# ========================================== #
mention-everyone-cooldown: "<red>Использование @everyone доступно через {time} сек.!</red>"

# ========================================== #
# ========================================== #
# ========================================== #
#      КОМАНДЫ (HELP)                        #
# ========================================== #
help-header: "<dark_gray>========== <aqua>Lovechat Помощь</aqua> ==========</dark_gray>"
help-reload: "<aqua>/chat reload</aqua> <gray>- Перезагрузить конфигурацию</gray>"
help-chat: "<aqua>/chat <канал></aqua> <gray>- Переключить канал чата</gray>"
help-silent: "<aqua>/silent</aqua> <gray>- Скрытый режим (сообщения не видны другим)</gray>"
help-ignore: "<aqua>/ignore <игрок></aqua> <gray>- Игнорировать игрока</gray>"
help-chatclear: "<aqua>/chatclear</aqua> <gray>- Очистить чат</gray>"
help-spy: "<aqua>/spy</aqua> <gray>- Режим шпиона (видеть все каналы)</gray>"

# ========================================== #
#      ОЧИСТКА ЧАТА                          #
# ========================================== #
chatclear-personal: "<green>Ваш чат очищен!</green>"
chatclear-global-users: "<green>Чат очищен для всех пользователей!</green>"
chatclear-global-all: "<green>Чат очищен полностью!</green>"

# ========================================== #
#      РЕЖИМЫ                                #
# ========================================== #
# Spy режим
spy-enabled: "<green>Режим шпиона <aqua>включён</aqua>!</green>"
spy-disabled: "<green>Режим шпиона <aqua>выключен</aqua>!</green>"

# Silent режим
silent-enabled: "<green>Silent режим <aqua>включён</aqua>!</green>"
silent-disabled: "<green>Silent режим <aqua>выключен</aqua>!</green>"

# TagToggle режим
tags-enabled-self: "<yellow>Теперь другие игроки не смогут вас упоминать.</yellow>"
tags-disabled-self: "<green>Теперь другие игроки снова могут вас упоминать.</green>"
tags-enabled-other: "<green>Упоминания для {player} отключены.</green>"
tags-disabled-other: "<green>Упоминания для {player} включены.</green>"

# ========================================== #
#      УПОМИНАНИЯ (форматы)                  #
# ========================================== #
mention-format: "<gradient:#00FF00:#00AA00><b>@%player%</b></gradient>"
mention-format-target: "<yellow><b>%player%</b></yellow>"
mention-format-others: "<green>%player%</green>"
mention-actionbar: "<gold>Вас упомянули в чате!</gold>"

# ========================================== #
#      ССЫЛКИ                                #
# ========================================== #
link-format: "<hover:show_text:'<gray>Нажмите для перехода:<br><white>%link%</white>'><click:open_url:'%url%'><aqua><b>[Ссылка]</b></aqua></click></hover>"

# ========================================== #
#      УВЕДОМЛЕНИЯ ПЕРСОНАЛУ                 #
# ========================================== #
staff-notification-format: "<red>[Внимание]</red> <yellow>Игрок <player> просит помощи:</yellow> <gray><message></gray>"

# ========================================== #
# ========================================== #
